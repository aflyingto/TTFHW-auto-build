name: MindIE-SD-TTFHW-auto-build

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-mindie-sd.yml'
      - 'build/**'
      - 'src/**'
      - 'setup.py'
      - 'pyproject.toml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-mindie-sd.yml'
      - 'build/**'
      - 'src/**'
      - 'setup.py'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Check Docker environment dependencies
      run: |
        echo "Checking Docker installation..."
        if ! command -v docker &> /dev/null; then
          echo "ERROR: Docker is not installed"
          exit 1
        fi
        
        echo "Checking Docker daemon status..."
        if ! docker info &> /dev/null; then
          echo "ERROR: Docker daemon is not running"
          exit 1
        fi
        
        echo "Checking Docker Buildx..."
        if ! docker buildx version &> /dev/null; then
          echo "ERROR: Docker Buildx is not available"
          exit 1
        fi
        
        echo "Checking disk space..."
        AVAILABLE_SPACE=$(df -BG / | awk 'NR==2 {print $4}' | sed 's/G//')
        if [ "$AVAILABLE_SPACE" -lt 20 ]; then
          echo "WARNING: Available disk space is less than 20GB"
        fi
        
        echo "Checking network connectivity to image registry..."
        IMAGE_REGISTRY="swr.cn-north-4.myhuaweicloud.com"
        echo "Checking network connectivity to image registry..."
        IMAGE_REGISTRY="swr.cn-north-4.myhuaweicloud.com"
        if ! ping -c 1 -W 5 "$IMAGE_REGISTRY" &> /dev/null; then
          echo "WARNING: Cannot ping image registry $IMAGE_REGISTRY"
        fi
        
        echo "Docker environment check passed!"
        docker --version
        docker buildx version
    
    - name: Cache Docker image
      id: cache_image
      uses: actions/cache@v4
      with:
        path: /tmp/docker-image.tar
        key: docker-image-ascend-mindie-ubuntu-x86-20260119
        restore-keys: |
          docker-image-ascend-mindie-ubuntu-x86-
    
    - name: Pull Docker image
      id: pull_image
      run: |
        echo "START_TIME=$(date +%s)" >> $GITHUB_OUTPUT
        
        IMAGE_NAME="swr.cn-north-4.myhuaweicloud.com/inference/ascend_mindie_ubuntu_x86:20260119_ubuntu24_3.0.0_cann8.5.0_torch2.6.0_py311"
        
        echo "Cache hit status: ${{ steps.cache_image.outputs.cache-hit }}"
        
        if [ "${{ steps.cache_image.outputs.cache-hit }}" == "true" ] && [ -f /tmp/docker-image.tar ]; then
          echo "Loading Docker image from cache..."
          docker load -i /tmp/docker-image.tar
        else
          echo "Pulling Docker image from registry..."
          docker pull $IMAGE_NAME
          echo "Saving Docker image to cache..."
          docker save $IMAGE_NAME -o /tmp/docker-image.tar
        fi
        
        echo "END_TIME=$(date +%s)" >> $GITHUB_OUTPUT
    
    - name: Clone MindIE-SD repository
      id: clone
      run: |
        echo "START_TIME=$(date +%s)" >> $GITHUB_OUTPUT
        git clone https://gitcode.com/Ascend/MindIE-SD.git mindie-sd
        echo "END_TIME=$(date +%s)" >> $GITHUB_OUTPUT
    
    - name: Build MindIE-SD wheel package
      id: build
      run: |
        echo "START_TIME=$(date +%s)" >> $GITHUB_OUTPUT
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/mindie-sd \
          -u $(id -u):$(id -g) \
          swr.cn-north-4.myhuaweicloud.com/inference/ascend_mindie_ubuntu_x86:20260119_ubuntu24_3.0.0_cann8.5.0_torch2.6.0_py311 \
          bash -c "source /usr/local/Ascend/ascend-toolkit/latest/set_env.sh && export TORCH_DEVICE_BACKEND_AUTOLOAD=0 && export USER_ABI_VERSION=1 && bash build/build.sh && ls -lh dist/"
        echo "END_TIME=$(date +%s)" >> $GITHUB_OUTPUT
    
    - name: Start upload timer
      id: upload_start
      run: |
        echo "START_TIME=$(date +%s)" >> $GITHUB_OUTPUT
    
    - name: Upload wheel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mindie-sd-wheel
        path: mindie-sd/dist/*.whl
        retention-days: 30
    
    - name: End upload timer
      id: upload_end
      run: |
        echo "END_TIME=$(date +%s)" >> $GITHUB_OUTPUT
    
    - name: Calculate and display build statistics
      run: |
        PULL_TIME=$(( ${{ steps.pull_image.outputs.END_TIME }} - ${{ steps.pull_image.outputs.START_TIME }} ))
        CLONE_TIME=$(( ${{ steps.clone.outputs.END_TIME }} - ${{ steps.clone.outputs.START_TIME }} ))
        BUILD_TIME=$(( ${{ steps.build.outputs.END_TIME }} - ${{ steps.build.outputs.START_TIME }} ))
        UPLOAD_TIME=$(( ${{ steps.upload_end.outputs.END_TIME }} - ${{ steps.upload_start.outputs.START_TIME }} ))
        
        echo "## Build Time Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Phase | Duration (seconds) | Duration (minutes) |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|-------------------|-------------------|" >> $GITHUB_STEP_SUMMARY
        echo "| Image Pull | $PULL_TIME | $(awk "BEGIN {printf \"%.2f\", $PULL_TIME/60}") |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Download | $CLONE_TIME | $(awk "BEGIN {printf \"%.2f\", $CLONE_TIME/60}") |" >> $GITHUB_STEP_SUMMARY
        echo "| Build | $BUILD_TIME | $(awk "BEGIN {printf \"%.2f\", $BUILD_TIME/60}") |" >> $GITHUB_STEP_SUMMARY
        echo "| Artifact Upload | $UPLOAD_TIME | $(awk "BEGIN {printf \"%.2f\", $UPLOAD_TIME/60}") |" >> $GITHUB_STEP_SUMMARY
        
        TOTAL_TIME=$(( PULL_TIME + CLONE_TIME + BUILD_TIME + UPLOAD_TIME ))
        echo "| **Total** | **$TOTAL_TIME** | **$(awk "BEGIN {printf \"%.2f\", $TOTAL_TIME/60}")** |" >> $GITHUB_STEP_SUMMARY